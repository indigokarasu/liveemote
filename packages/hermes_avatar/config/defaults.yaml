affect:
  update_hz: 30
  min_emote_dwell_ms: 1200
  reaction_delay_ms:
    mirror_min: 250
    mirror_max: 900
    reflect_min: 600
    reflect_max: 1600
  smoothing:
    face_alpha: 0.35
    audio_alpha: 0.45
    affect_alpha: 0.25
gaze:
  enabled: true
  max_yaw_deg: 12
  max_pitch_deg: 8
behavior:
  default_mode: reflect
  mirroring_strength: 0.22
agent:
  mode: fake
  harness: generic
  url: ws://127.0.0.1:18789/avatar
  base_url: https://api.openai.com
  model: gpt-4o-mini
renderer:
  livetalking_url: http://127.0.0.1:8010
voice:
  backend: luxtts
  device: cpu
  cache_dir: cache/voice
faceswap:
  backend: facefusion
  enabled: false
  device: cpu
  input_source: http://127.0.0.1:8010
  frame_rate: 25
  swap_threshold: 0.0
  vendor_dir: vendor/FaceFusion
  models_dir: models
  require_gpu: false
  process_timeout: 30.0
  # Sidecar split (recommended for production). Set ``sidecar_url`` to the
  # service name from docker-compose.yml (``http://liveemote-facefusion:8001``
  # by default) and the adapter will auto-pick ``FaceFusionSidecarDaemon``
  # instead of attempting the in-process FaceFusionVendorDaemon, which would
  # fail under Python 3.10. Deep-Live-Cam ignores these fields — it stays in
  # the main process regardless.
  sidecar_url: null
  sidecar_api_key: null
  sidecar_connect_timeout_s: 2.0
  sidecar_request_timeout_s: 8.0
  sidecar_jpeg_quality: 85
  sidecar_require_auth: false
