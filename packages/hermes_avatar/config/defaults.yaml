affect:
  update_hz: 30
  min_emote_dwell_ms: 1200
  reaction_delay_ms:
    mirror_min: 250
    mirror_max: 900
    reflect_min: 600
    reflect_max: 1600
  smoothing:
    face_alpha: 0.35
    audio_alpha: 0.45
    affect_alpha: 0.25
gaze:
  enabled: true
  max_yaw_deg: 12
  max_pitch_deg: 8
behavior:
  default_mode: reflect
  mirroring_strength: 0.22
agent:
  mode: fake
  harness: generic
  url: ws://127.0.0.1:18789/avatar
  base_url: https://api.openai.com
  model: gpt-4o-mini
renderer:
  livetalking_url: http://127.0.0.1:8010
voice:
  backend: luxtts
  device: cpu
  cache_dir: cache/voice
faceswap:
  backend: facefusion
  enabled: false
  device: cpu
  input_source: http://127.0.0.1:8010
  frame_rate: 25
  swap_threshold: 0.0
  vendor_dir: vendor/FaceFusion
  models_dir: models
  require_gpu: false
  process_timeout: 30.0
